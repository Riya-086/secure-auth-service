name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs unit tests (surefire) and Testcontainers integration tests (failsafe).
      # The GitHub Ubuntu runner provides the Docker daemon that Testcontainers needs.
      - name: Build and test
        run: mvn -B verify
