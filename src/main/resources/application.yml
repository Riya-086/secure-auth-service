spring:
  application:
    name: secure-auth-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/authservice}

server:
  port: ${PORT:8080}

auth:
  jwt:
    # HMAC-SHA256 signing key, at least 32 bytes. No default: startup fails if it is missing.
    secret: ${JWT_SECRET}
    issuer: secure-auth-service
    access-token-ttl: 15m
  refresh:
    # Absolute lifetime of a login session. Rotation never extends it.
    session-ttl: 30d
    # How long after rotation a reused token is treated as a concurrent retry instead of a replay.
    grace-window: 10s
  rate-limit:
    # Token buckets for POST /auth/refresh. Capacity is the burst size; refill is the steady rate.
    refresh-per-user:
      capacity: 5
      refill-per-minute: 5
    refresh-per-ip:
      capacity: 30
      refill-per-minute: 30
